<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 585" width="1000" height="585" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Proceso LoanApplication (Bizagi) - diagrama reconstruido</title>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b2f3a"/>
    </marker>
  </defs>

  <!-- Fondo y título -->
  <rect width="1000" height="585" fill="#ffffff"/>
  <text x="20" y="30" font-size="18" font-weight="700" fill="#14161c">Proceso LoanApplication (solicitud de préstamo)</text>

  <!-- Carriles -->
  <rect x="20" y="50" width="960" height="240" fill="#fafbfc" stroke="#2b2f3a" stroke-width="1.5"/>
  <rect x="20" y="50" width="36" height="240" fill="#eef0f4" stroke="#2b2f3a" stroke-width="1.5"/>
  <text transform="translate(44,170) rotate(-90)" text-anchor="middle" font-size="14" font-weight="700" fill="#14161c">Loan Officer</text>

  <rect x="20" y="290" width="960" height="240" fill="#fafbfc" stroke="#2b2f3a" stroke-width="1.5"/>
  <rect x="20" y="290" width="36" height="240" fill="#eef0f4" stroke="#2b2f3a" stroke-width="1.5"/>
  <text transform="translate(44,410) rotate(-90)" text-anchor="middle" font-size="14" font-weight="700" fill="#14161c">Loan Manager</text>

  <!-- ===== Conexiones ===== -->
  <g fill="none" stroke="#2b2f3a" stroke-width="1.6" marker-end="url(#flecha)">
    <!-- Inicio -> Register Application -->
    <path d="M147,200 H200"/>
    <!-- Register Application -> compuerta paralela -->
    <path d="M350,200 H404"/>
    <!-- compuerta paralela -> Pre Approved? -->
    <path d="M456,200 H512"/>
    <!-- compuerta paralela -> Cancel Application -->
    <path d="M430,174 V105 H503"/>
    <!-- Cancel Application -> fin con terminación -->
    <path d="M537,105 H613"/>
    <!-- Pre Approved? Yes -> Send Notification of Approval -->
    <path d="M568,200 H640"/>
    <!-- Pre Approved? No -> Analyze Application -->
    <path d="M540,228 V368"/>
    <!-- Analyze Application -> compuerta exclusiva -->
    <path d="M615,400 H687"/>
    <!-- compuerta exclusiva Yes -> Send Notification of Approval -->
    <path d="M715,372 V232"/>
    <!-- compuerta exclusiva No -> Send Notification of Rejection -->
    <path d="M743,400 H800"/>
    <!-- Send Notification of Approval -> Fin -->
    <path d="M790,200 H858"/>
    <!-- Send Notification of Rejection -> Fin -->
    <path d="M875,368 V217"/>
  </g>

  <!-- Etiquetas de las ramas -->
  <g font-size="12" fill="#14161c">
    <text x="604" y="191" text-anchor="middle">Yes</text>
    <text x="554" y="302">No</text>
    <text x="727" y="312">Yes</text>
    <text x="771" y="391" text-anchor="middle">No</text>
  </g>

  <!-- ===== Eventos ===== -->
  <!-- Inicio -->
  <circle cx="130" cy="200" r="17" fill="#ffffff" stroke="#2b2f3a" stroke-width="1.6"/>
  <!-- Cancel Application (evento intermedio) -->
  <circle cx="520" cy="105" r="17" fill="#ffffff" stroke="#2b2f3a" stroke-width="1.6"/>
  <circle cx="520" cy="105" r="13" fill="none" stroke="#2b2f3a" stroke-width="1.2"/>
  <text x="520" y="136" text-anchor="middle" font-size="12" fill="#14161c">Cancel Application</text>
  <!-- Fin con terminación -->
  <circle cx="630" cy="105" r="17" fill="#ffffff" stroke="#2b2f3a" stroke-width="3.2"/>
  <circle cx="630" cy="105" r="9" fill="#2b2f3a"/>
  <!-- Fin -->
  <circle cx="875" cy="200" r="17" fill="#ffffff" stroke="#2b2f3a" stroke-width="3.2"/>

  <!-- ===== Compuertas ===== -->
  <!-- Paralela -->
  <path d="M430,174 L456,200 L430,226 L404,200 z" fill="#ffffff" stroke="#2b2f3a" stroke-width="1.6"/>
  <path d="M430,188 V212 M418,200 H442" stroke="#2b2f3a" stroke-width="2.4"/>
  <!-- Pre Approved? (exclusiva) -->
  <path d="M540,172 L568,200 L540,228 L512,200 z" fill="#ffffff" stroke="#2b2f3a" stroke-width="1.6"/>
  <path d="M532,192 L548,208 M548,192 L532,208" stroke="#2b2f3a" stroke-width="2.4"/>
  <text x="540" y="164" text-anchor="middle" font-size="12" font-weight="700" fill="#14161c">Pre Approved?</text>
  <!-- Exclusiva del Loan Manager -->
  <path d="M715,372 L743,400 L715,428 L687,400 z" fill="#ffffff" stroke="#2b2f3a" stroke-width="1.6"/>
  <path d="M707,392 L723,408 M723,392 L707,408" stroke="#2b2f3a" stroke-width="2.4"/>

  <!-- ===== Tareas ===== -->
  <g fill="#fff6f1" stroke="#e8734a" stroke-width="2">
    <rect x="200" y="168" width="150" height="64" rx="9"/>
    <rect x="640" y="168" width="150" height="64" rx="9"/>
    <rect x="465" y="368" width="150" height="64" rx="9"/>
    <rect x="800" y="368" width="150" height="64" rx="9"/>
  </g>
  <g font-size="13" font-weight="700" fill="#14161c" text-anchor="middle">
    <text x="275" y="205">Register Application</text>
    <text x="715" y="196">Send Notification</text>
    <text x="715" y="214">of Approval</text>
    <text x="540" y="405">Analyze Application</text>
    <text x="875" y="396">Send Notification</text>
    <text x="875" y="414">of Rejection</text>
  </g>

  <!-- Hitos del proceso -->
  <g font-size="11" fill="#5b6270">
    <text x="70" y="70">Hito: Loan Registration</text>
    <text x="70" y="310">Hito: Loan Analysis</text>
  </g>

  <!-- Nota de origen -->
  <text x="20" y="556" font-size="12" fill="#3b404c">Diagrama reconstruido a partir del paquete LoanApplication.bex (Bizagi 11.2.5, diciembre de 2022).</text>
  <text x="20" y="574" font-size="12" fill="#3b404c">Carriles, tareas, compuertas y conexiones corresponden al modelo original; el dibujo no es una captura de Bizagi.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
